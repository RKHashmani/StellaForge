[workspace]
channels = ["conda-forge", "bioconda"]
name = "driftless-star"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[feature.pipeline]
channels = ["conda-forge", "bioconda"]

[feature.pipeline.dependencies]
# Floor 9.16: the DAG dry-run test passes --runtime-source-cache-path, added in snakemake 9.16.
snakemake-minimal = ">=9.16,<10"
graphviz = ">=9,<15"
pytest = ">=8,<9"

[feature.pipeline.tasks.driftless-star]
cmd = "python -m src.ouroboros"
default-environment = "pipeline"
description = "Closed-loop driver; --max-iters 1 for a single pass"

[feature.pipeline.tasks.driftless-star-fwd]
cmd = "snakemake"
default-environment = "pipeline"
description = "Single forward pass, Stage 1 through Stage 5"

[feature.pipeline.target.linux-64.pypi-dependencies]
snakemake-executor-plugin-htcondor = "==0.3.0"

[feature.test.dependencies]
numpy = ">=2,<3"
h5py = ">=3,<4"
netcdf4 = ">=1.6,<2"
scipy = ">=1.13,<2"
pyyaml = ">=6,<7"

[feature.test.tasks.test]
cmd = "pytest -m 'not docker and not stage_env and not e2e' && pytest --doctest-modules src/utils/config_edit.py src/utils/paths.py src/io_contracts.py"

[environments]
pipeline = { features = ["pipeline"], no-default-feature = true }
test = { features = ["pipeline", "test"], no-default-feature = true }

[dependencies]
snakemake = ">=9.24.0,<10"

[target.linux-64.pypi-dependencies]
snakemake-executor-plugin-htcondor = "==0.3.0"
