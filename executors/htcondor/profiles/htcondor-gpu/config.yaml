# Run Snakemake on the submit host:
#
  # pixi run driftless-star-fwd \
  #   --profile executors/htcondor/profiles/htcondor-gpu \
  #   --configfile inputs/quick_run/config.yaml \
  #   --config gpu_ids=all container_runtime=apptainer \
  #   --cores 8
#
# Each remote rule job runs inside the parent Apptainer image below.
# Note: The apptainer sif file need to be in the root dir to run successfully.

executor: htcondor
jobs: unlimited
shared-fs-usage: none
htcondor-shared-fs-prefixes: "/staging,/shared"
# latency-wait: 120
max-status-checks-per-second: 2
printshellcmds: true
show-failed-logs: true
restart-times: 0
jobname: "{rule}-{jobid}"
# The executor sets HTCondor's log, output, and error paths itself from this directory.
htcondor-jobdir: jobs

default-resources:
  universe: "container"
  container_image: "htcondor-runtime.sif"
  job_wrapper: "executors/htcondor/job_wrapper.sh"
  htcondor_transfer_input_files: "Snakefile,src,stages,inputs,executors/htcondor"
  requirements: '(HasCHTCStaging==true)'
  request_gpus: "1"
  request_disk: "20GB"
  request_memory: "16GB"
  gpus_minimum_memory: "12GB"
  classad_is_resumable: true

set-resources:
  stage4_run_one:
    gpus_minimum_memory: "24GB"
    request_memory: "64GB"

set-threads:
  stage1_vmec: 4
  stage2_boozer: 4
  stage3_prepare: 4
  stage3_run_one: 4
  stage3_collect: 4
  stage4_prepare: 4
  stage4_run_one: 4
  stage4_collect: 4
  stage5_neopax: 4
  stage5_post_processing: 4
