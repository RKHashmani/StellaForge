# Shared-filesystem HTCondor profile for StellaForge.
#
# Usage:
#   pixi install --environment pipeline
#   pixi run -e pipeline snakemake --profile profiles/htcondor --config container_runtime=apptainer
#
# Notes:
# - This profile assumes the repository and `.pixi/` environment are visible on
#   both the submit host and execute nodes.
# - Rule payloads still launch the stage containers directly; HTCondor is used
#   only as the Snakemake executor.

executor: htcondor
jobs: 20
latency-wait: 120
max-status-checks-per-second: 2
printshellcmds: true
show-failed-logs: true
restart-times: 1
jobname: "{rule}-{jobid}"
htcondor-jobdir: .snakemake/htcondor

default-resources:
  - job_wrapper=profiles/htcondor/job_wrapper.sh
  - getenv=True
  - htcondor_request_mem_mb=16000
  - htcondor_request_disk_mb=51200
